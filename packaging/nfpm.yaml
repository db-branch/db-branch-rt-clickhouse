name: db-branch-rt-clickhouse
arch: ${GOARCH}
version: ${VERSION}
section: database
priority: optional
maintainer: db-branch
description: ClickHouse as a db-branch runtime module
license: Proprietary
depends:
  - db-branch
contents:
  - src: bin/db-branch-rt-clickhouse
    dst: /usr/lib/db-branch/runtimes/clickhouse/db-branch-rt-clickhouse
    file_info: {mode: 0755, owner: root, group: root}
  - src: packaging/manifest.json
    dst: /usr/lib/db-branch/runtimes/clickhouse/manifest.json
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/manifest.json.sig
    dst: /usr/lib/db-branch/runtimes/clickhouse/manifest.json.sig
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/runtimes.json
    dst: /usr/lib/db-branch/runtimes/clickhouse/runtimes.json
    file_info: {mode: 0644, owner: root, group: root}
scripts:
  postinstall: packaging/postinst
